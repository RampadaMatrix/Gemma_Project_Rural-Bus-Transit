<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Geocoding Audit (Pro Performance)</title>
    <style>
        :root { --primary: #2980b9; --bg: #f8f9fa; --header-bg: #ffffff; --text: #2c3e50; --border: #dee2e6; --shadow: rgba(0, 0, 0, 0.05); }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        #map { height: calc(100% - 70px); width: 100%; }
        #header { 
            height: 70px; background: var(--header-bg); display: flex; align-items: center; 
            padding: 0 30px; justify-content: space-between; border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow); z-index: 1000;
        }
        .logo-area { display: flex; flex-direction: column; }
        .controls { display: flex; gap: 20px; align-items: center; }
        .legend { font-size: 11px; display: flex; gap: 15px; background: #fff; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border); }
        .legend-item { display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .v-ok { background: #27ae60; }
        .v-err { background: #e74c3c; border: 1px solid white; }
        #status { font-weight: 600; color: var(--primary); font-size: 13px; }
        .btn { background: #fff; color: var(--text); border: 1px solid var(--border); padding: 10px 18px; cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.2s; font-size: 13px; }
        .btn:hover { background: #f1f3f5; transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; border: none; }
        #sidebar { 
            position: absolute; right: 30px; top: 100px; width: 260px; max-height: 75vh; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 20px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000;
            border: 1px solid var(--border); display: none;
        }
        .block-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f1f3f5; align-items: center; }
        .err-count { background: #fff1f0; color: #cf1322; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 11px; }
        #progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #2ecc71; width: 0%; z-index: 2000; transition: width 0.1s; }
    </style>
    <script src="purulia_block_boundaries.js"></script>
</head>
<body>

<div id="progress-bar"></div>
<div id="header">
    <div class="logo-area">
        <h2 style="margin:0; font-size: 20px; font-weight: 800;">District <span style="color:var(--primary)">Inspector</span> <span style="font-size:10px; opacity:0.5;">v3.0</span></h2>
        <div id="status">Ready. Select village data. (2km Margin Applied)</div>
    </div>
    <div class="controls">
        <input type="file" id="villageInput" accept=".json" style="display:none">
        <button class="btn btn-primary" onclick="document.getElementById('villageInput').click()">Load Village Coordinates</button>
        <div class="legend">
            <div class="legend-item"><div class="dot v-ok"></div> Valid / Near</div>
            <div class="legend-item"><div class="dot v-err"></div> Hallucination</div>
        </div>
    </div>
</div>

<div id="map"></div>
<div id="sidebar"><h3>Audit Summary</h3><div id="blockStats"></div></div>

<script>
    let map;
    const blockPolygons = {};
    const MARGIN_KM = 2.0;

    function getDistance(p1, p2) {
        const R = 6371; // km
        const dLat = (p2.lat - p1.lat) * Math.PI / 180;
        const dLon = (p2.lng - p1.lng) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function isInsideWithMargin(pt, polyPaths) {
        // 1. Precise Check
        let inside = false;
        for (const poly of polyPaths) {
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                if (((poly[i].lat > pt.lat) != (poly[j].lat > pt.lat)) &&
                    (pt.lng < (poly[j].lng - poly[i].lng) * (pt.lat - poly[i].lat) / (poly[j].lat - poly[i].lat) + poly[i].lng)) {
                    inside = !inside;
                }
            }
            if (inside) return true;
        }

        // 2. Margin Check (Check distance to sample vertices if outside)
        // Optimization: only check every 5th vertex for distance to save time
        for (const poly of polyPaths) {
            for (let i = 0; i < poly.length; i += 5) {
                if (getDistance(pt, poly[i]) < MARGIN_KM) return true;
            }
        }
        return false;
    }

    function initMap() {
        const softWhiteStyles = [{ "featureType": "all", "stylers": [{ "saturation": -100 }, { "lightness": 50 }] }];
        map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 23.3309, lng: 86.3611 }, zoom: 10, styles: softWhiteStyles, disableDefaultUI: true, zoomControl: true
        });

        renderBoundaries();
        document.getElementById('villageInput').addEventListener('change', handleVillages);
    }

    function renderBoundaries() {
        if (typeof PURULIA_BLOCKS === 'undefined') return;
        let i = 0;
        const colors = ['#3498db', '#e67e22', '#9b59b6', '#1abc9c', '#f1c40f', '#e74c3c', '#2ecc71', '#d35400', '#2980b9'];
        
        for (const [name, data] of Object.entries(PURULIA_BLOCKS)) {
            const color = colors[i % colors.length];
            const paths = data.type === "MultiPolygon" ? data.coordinates.map(p => p[0].map(c => ({ lat: c[1], lng: c[0] }))) : [data.coordinates[0].map(c => ({ lat: c[1], lng: c[0] }))];
            
            new google.maps.Polygon({ paths: paths, strokeColor: color, strokeOpacity: 0.6, strokeWeight: 1, fillColor: color, fillOpacity: 0.05, map: map, clickable: false });
            blockPolygons[name] = paths;
            i++;
        }
    }

    function handleVillages(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const villages = JSON.parse(e.target.result);
            processVillagesFast(villages);
        };
        reader.readAsText(file);
    }

    function processVillagesFast(villages) {
        map.data.forEach(f => map.data.remove(f)); // Clear previous data layer
        const stats = {};
        let totalErr = 0;
        
        // Setup Data Layer Styling
        map.data.setStyle(feature => {
            const isErr = feature.getProperty('isErr');
            return {
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: isErr ? 3.5 : 1.5,
                    fillColor: isErr ? '#e74c3c' : '#27ae60',
                    fillOpacity: 0.8,
                    strokeWeight: isErr ? 1 : 0,
                    strokeColor: '#fff'
                },
                title: feature.getProperty('name')
            };
        });

        const total = villages.length;
        let count = 0;

        function chunk() {
            const start = count;
            const end = Math.min(count + 500, total);
            
            for (let i = start; i < end; i++) {
                const v = villages[i];
                if (!v.lat || !v.lon) continue;

                if (!stats[v.block]) stats[v.block] = { total: 0, err: 0 };
                stats[v.block].total++;

                const polyPaths = blockPolygons[v.block];
                const isOk = polyPaths ? isInsideWithMargin({ lat: v.lat, lng: v.lon }, polyPaths) : true;
                
                if (!isOk) { stats[v.block].err++; totalErr++; }

                map.data.add({
                    geometry: new google.maps.Data.Point({ lat: v.lat, lng: v.lon }),
                    properties: { name: v.name, block: v.block, isErr: !isOk }
                });
            }

            count = end;
            const pct = Math.floor((count / total) * 100);
            document.getElementById('progress-bar').style.width = pct + "%";
            document.getElementById('status').innerText = `Analyzing... ${pct}%`;

            if (count < total) {
                requestAnimationFrame(chunk);
            } else {
                finalize(stats, totalErr);
            }
        }
        chunk();
    }

    function finalize(stats, totalErr) {
        const container = document.getElementById('blockStats');
        container.innerHTML = "";
        const sorted = Object.entries(stats).sort((a, b) => b[1].err - a[1].err);
        sorted.forEach(([name, s]) => {
            const div = document.createElement('div');
            div.className = "block-item";
            div.innerHTML = `<span>${name}</span><span class="err-count">${s.err}/${s.total}</span>`;
            container.appendChild(div);
        });
        document.getElementById('sidebar').style.display = "block";
        document.getElementById('status').innerText = `Audit Complete: ${totalErr} issues found (with 2km buffer).`;
        document.getElementById('status').style.color = "#e74c3c";
        document.getElementById('progress-bar').style.width = "0%";
    }

    window.onload = initMap;
</script>
<script>
fetch("/api/config")
  .then(r => r.json())
  .then(cfg => {
    const key = (cfg && cfg.google_maps_api_key) ? String(cfg.google_maps_api_key) : "";
    if (!key) {
      console.error("Missing google_maps_api_key");
      return;
    }
    const s = document.createElement("script");
    s.async = true;
    s.defer = true;
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initMap`;
    document.head.appendChild(s);
  })
  .catch(err => console.error("Failed to load /api/config", err));
</script>
</body>
</html>
